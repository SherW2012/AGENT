<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的美食地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header id="topbar">
      <div class="brand">🗺️ 我的美食地图</div>
      <div class="topbar-actions">
        <button id="btn-locate" class="btn btn-ghost" title="定位到我的位置">📍 定位</button>
        <button id="btn-export" class="btn btn-ghost" title="导出数据为 JSON 文件">⬇️ 导出</button>
        <button id="btn-import" class="btn btn-ghost" title="从 JSON 文件导入数据">⬆️ 导入</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <button id="btn-toggle-sidebar" class="btn btn-ghost" title="收起/展开侧栏">☰</button>
      </div>
    </header>

    <div id="main">
      <!-- 侧栏 -->
      <aside id="sidebar">
        <nav class="tabs">
          <button class="tab active" data-tab="list">📋 列表</button>
          <button class="tab" data-tab="rank">🏆 排行榜</button>
          <button class="tab" data-tab="stats">📊 统计</button>
        </nav>

        <!-- 筛选区 -->
        <div class="filters">
          <input type="search" id="filter-keyword" placeholder="搜索店名 / 备注…">
          <div class="filter-row">
            <select id="filter-category">
              <option value="">全部种类</option>
            </select>
            <select id="filter-rating">
              <option value="0">全部评分</option>
              <option value="5">仅 5 星</option>
              <option value="4">4 星及以上</option>
              <option value="3">3 星及以上</option>
            </select>
          </div>
        </div>

        <!-- 列表 -->
        <div class="tab-panel active" id="panel-list">
          <div id="spot-list" class="spot-list"></div>
        </div>

        <!-- 排行榜 -->
        <div class="tab-panel" id="panel-rank">
          <div id="rank-list" class="spot-list"></div>
        </div>

        <!-- 统计 -->
        <div class="tab-panel" id="panel-stats">
          <div id="stats-content"></div>
        </div>
      </aside>

      <!-- 地图 -->
      <div id="map"></div>

      <!-- 添加提示 -->
      <div id="add-hint">点击地图任意位置，添加一家好吃的店 🍜</div>
    </div>
  </div>

  <!-- 添加 / 编辑 弹窗 -->
  <div id="modal-mask" class="hidden">
    <div id="spot-modal">
      <h3 id="modal-title">添加美食</h3>
      <form id="spot-form">
        <label>店名 <span class="required">*</span>
          <input type="text" id="f-name" required maxlength="40" placeholder="例如：老王牛肉面">
        </label>

        <label>种类
          <div class="category-picker" id="f-category-picker"></div>
          <input type="text" id="f-category-custom" maxlength="10" placeholder="或输入自定义种类…">
        </label>

        <label>评分 <span class="required">*</span>
          <div class="star-input" id="f-stars">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </label>

        <label>人均（元）
          <input type="number" id="f-price" min="0" max="99999" step="1" placeholder="选填">
        </label>

        <label>备注
          <textarea id="f-notes" maxlength="200" rows="3" placeholder="推荐菜、踩雷提醒、什么时候来的…"></textarea>
        </label>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
